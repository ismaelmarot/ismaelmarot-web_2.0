name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Run component tests
        run: npm run test:component

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub data
        run: npm run fetch:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Every browser playwright.config.ts declares, not just chromium. This installed chromium alone
      # while the config listed five projects, so firefox, webkit, Mobile Chrome and Mobile Safari all
      # failed to launch with "Executable doesn't exist" and every E2E job failed before a single
      # assertion ran. The count was 684 such errors in the run before specs/013 landed.
      #
      # --with-deps installs the system libraries the Linux runners are missing, which is why it is here
      # rather than a bare `playwright install`: webkit in particular needs them.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Serve build and run E2E tests
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173

  test-a11y:
    name: Accessibility
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # The same Chromium the browser tests use, so the audit and the suite are measuring one browser.
      - name: Install Chromium for the audit
        run: npx playwright install --with-deps chromium

      # @axe-core/playwright rather than axe-cli.
      #
      # axe-cli resolves a chromedriver at run time, and the one it reaches for is pinned to a Chrome
      # major version of its own. The runner installed Chrome 153 from Playwright while that driver
      # announced it "only supports Chrome version 155", so every audit died with SessionNotCreatedError
      # before auditing anything. An earlier attempt pinned CHROME_PATH to Playwright's Chromium and it
      # did not help: the mismatch is between the driver axe-cli downloads and whatever browser it
      # launches, not between a path variable and a browser.
      #
      # Driving the audit through Playwright removes the second tool entirely: the browser is the one
      # already installed and already tested against, so nothing is left to keep in step. @axe-core/cli
      # is removed, since nothing references it now.
      - name: Run accessibility audit
        run: node scripts/audit-a11y.mjs
        env:
          CI: true
